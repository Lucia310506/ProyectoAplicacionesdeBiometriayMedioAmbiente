<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mediciones ambientales</title>
  <script src="../logicaFake/PeticionarioREST.js"></script>
  <script src="../logicaFake/LogicaFake.js"></script>
  <script src="../tests/pruebas_consola.js" defer></script>
  <script src="Aplicacion.js" defer></script>
  <style>
    body { margin: 0; background: #f2f7f6; color: #17372f; font-family: Arial, sans-serif; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    section { padding: 24px; background: #fff; box-shadow: 0 2px 12px #00251b1a; border-radius: 12px; }
    #estado { min-height: 24px; font-weight: bold; }
    .controles-tests { margin: 16px 0; }
    #estado-tests { display: inline; margin-left: 12px; }
    .error { color: #a01717; }
    .ok { color: #167042; }
    .carga { color: #1b4f72; }
    @media (max-width: 600px) {
      main { margin: 16px auto; }
      section { padding: 16px; }
    }
  </style>
</head>
<body>
<main>
  <h1>Mediciones ambientales</h1>
  <section aria-labelledby="titulo-mediciones">
    <h2 id="titulo-mediciones">Mediciones almacenadas</h2>
    <div class="controles-tests">
      <button id="boton-tests" type="button">Ejecutar pruebas</button>
      <p id="estado-tests" aria-live="polite">Las pruebas no se ejecutan al abrir la página.</p>
    </div>
    <p id="estado" aria-live="polite">Cargando mediciones...</p>
    <table>
      <caption>Detalle de mediciones</caption>
      <thead>
        <tr><th>Tipo</th><th>Valor</th><th>Fecha</th></tr>
      </thead>
      <tbody id="cuerpo-mediciones"></tbody>
    </table>
  </section>
</main>
</body>
</html>
