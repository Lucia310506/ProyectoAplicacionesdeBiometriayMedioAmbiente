<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mediciones ambientales</title>
  <script src="logicaFake/PeticionarioREST.js"></script>
  <script src="logicaFake/Aplicacion.js" defer></script>
  <style>
    body { margin: 0; background: #f2f7f6; color: #17372f; font-family: Arial, sans-serif; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    section { padding: 24px; background: #fff; box-shadow: 0 2px 12px #00251b1a; border-radius: 12px; }
    #estado { min-height: 24px; font-weight: bold; } .error { color: #a01717; } .ok { color: #167042; }
    #grafico { width: 100%; height: 380px; border: 1px solid #d6e3df; border-radius: 8px; background: #fff; }
    .leyenda { display: flex; gap: 20px; margin: 12px 0; } .co2 { color: #087a66; } .temperatura { color: #d15b24; }
    @media (max-width: 600px) { main { margin: 16px auto; } section { padding: 16px; } #grafico { height: 300px; } }
  </style>
</head>
<body>
<main>
  <h1>Mediciones ambientales</h1>
  <section aria-labelledby="titulo-mediciones">
    <h2 id="titulo-mediciones">Mediciones almacenadas</h2>
    <p id="estado" aria-live="polite">Cargando mediciones...</p>
    <div class="leyenda"><span class="co2">● CO2 (ppm)</span><span class="temperatura">● Temperatura (°C)</span></div>
    <svg id="grafico" viewBox="0 0 900 380" role="img" aria-label="Gráfico de CO2 y temperatura"></svg>
  </section>
</main>
</body>
</html>
