<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mediciones ambientales</title>
  <script src="logicaFake/PeticionarioRest.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; color: #18332d; margin: 0; }
    main { max-width: 900px; margin: 32px auto; padding: 0 18px; }
    section { background: white; border-radius: 12px; padding: 22px; margin: 18px 0; box-shadow: 0 2px 10px #0001; }
    label, input, select, button { font-size: 16px; } input, select { padding: 9px; margin: 4px 12px 4px 0; }
    button { background: #136f63; color: white; border: 0; border-radius: 7px; padding: 10px 14px; margin: 4px; cursor: pointer; }
    button:hover { background: #0d4e46; } #estado { min-height: 24px; font-weight: bold; } .error { color: #a61b1b; } .ok { color: #146b31; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; } th, td { padding: 10px; border-bottom: 1px solid #dce5e2; text-align: left; }
    @media (max-width: 600px) { main { margin-top: 16px; } table { font-size: 14px; } }
  </style>
</head>
<body>
<main>
  <h1>Mediciones ambientales</h1>
  <p id="estado" aria-live="polite">Listo para recibir mediciones.</p>

  <section>
    <h2>Datos fake</h2>
    <label for="tipo">Tipo</label>
    <select id="tipo"><option value="CO2">CO2</option><option value="TEMPERATURA">TEMPERATURA</option></select>
    <label for="valor">Valor</label>
    <input id="valor" type="number" step="any" value="235">
    <button type="button" onclick="enviarFormulario()">Enviar medición</button>
    <br>
    <button type="button" onclick="enviarEjemplo('CO2', 235)">Enviar CO2 = 235</button>
    <button type="button" onclick="enviarEjemplo('TEMPERATURA', -12)">Enviar temperatura = -12</button>
  </section>

  <section>
    <h2>Mediciones almacenadas</h2>
    <button type="button" onclick="actualizarMediciones()">Actualizar mediciones</button>
    <table><thead><tr><th>id</th><th>tipo</th><th>valor</th><th>fecha</th></tr></thead>
      <tbody id="filas"><tr><td colspan="4">Aún no se han consultado mediciones.</td></tr></tbody></table>
  </section>
</main>
<script>
// texto: Text, es_error: B --> mostrar_estado() -->
function mostrar_estado(texto, es_error) {
  const estado = document.getElementById('estado');
  estado.textContent = texto;
  estado.className = es_error ? 'error' : 'ok';
}

// --> enviarFormulario() -->
function enviarFormulario() {
  enviarEjemplo(document.getElementById('tipo').value, document.getElementById('valor').value);
}

// tipo: Text, valor: R --> enviarEjemplo() -->
async function enviarEjemplo(tipo, valor) {
  try {
    mostrar_estado('Guardando medición…', false);
    await enviar_medicion(tipo, valor);
    mostrar_estado('Medición guardada correctamente.', false);
    await actualizarMediciones();
  } catch (error) { mostrar_estado(error.message, true); }
}

// --> actualizarMediciones() -->
async function actualizarMediciones() {
  try {
    mostrar_estado('Consultando mediciones…', false);
    const mediciones = await pedir_mediciones();
    const filas = document.getElementById('filas');
    filas.innerHTML = mediciones.length === 0 ? '<tr><td colspan="4">No hay mediciones.</td></tr>' : '';
    mediciones.forEach(function (medicion) {
      const fila = document.createElement('tr');
      ['id', 'tipo', 'valor', 'fecha'].forEach(function (campo) {
        const celda = document.createElement('td'); celda.textContent = medicion[campo]; fila.appendChild(celda);
      });
      filas.appendChild(fila);
    });
    mostrar_estado('Mediciones actualizadas.', false);
  } catch (error) { mostrar_estado(error.message, true); }
}
</script>
</body>
</html>
